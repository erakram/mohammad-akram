<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Logo concepts — Mohammad Akram</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #05060f; color: #cbd5e1; font-family: Inter, sans-serif; padding: 40px; }
  h1 { font-family: 'Space Grotesk'; color: #fff; margin: 0 0 6px; }
  .sub { color: #64748b; margin-bottom: 36px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 24px; background: #0a0c1b; }
  .card.picked { border-color: rgba(34,211,238,.5); }
  .tag { font-family: 'JetBrains Mono'; font-size: 12px; color: #22d3ee; }
  .name { font-family: 'Space Grotesk'; font-size: 22px; color: #fff; margin: 4px 0 6px; font-weight: 700; }
  .desc { font-size: 14px; color: #94a3b8; min-height: 60px; }
  .hero { display: grid; place-items: center; height: 170px; margin: 14px 0; }
  .row { display: flex; align-items: center; gap: 18px; padding: 12px 14px; border-radius: 12px; background: #05060f; margin-top: 8px; }
  .lockup { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk'; font-weight: 700; color: #fff; font-size: 18px; }
  .lockup b { color: #67e8f9; }
  .light { background: #f8fafc; }
  .light .lockup { color: #0f172a; }
  .label { font-family: 'JetBrains Mono'; font-size: 11px; color: #64748b; margin-top: 12px; }
</style>
</head>
<body>
<h1>Logo concepts</h1>
<div class="sub">A is your current pick (outlined). B–I are new options. Each is shown large, in the navbar, at favicon size and on light.</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" /><stop offset=".55" stop-color="#22d3ee" /><stop offset="1" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" /><stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b" /><stop offset="1" stop-color="#0a0c1b" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>

    <!-- A: Neural monogram (current pick) -->
    <symbol id="A" viewBox="0 0 64 64">
      <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bg)" stroke="url(#g)" stroke-opacity=".5" stroke-width="1.5" />
      <path d="M13 46V18l11 16 11-16 11 28M24 34h17.4" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <g fill="#fff" filter="url(#glow)"><circle cx="13" cy="18" r="3" /><circle cx="35" cy="18" r="3" /><circle cx="24" cy="34" r="3" /><circle cx="13" cy="46" r="2.4" /><circle cx="46" cy="46" r="2.4" /><circle cx="41.4" cy="34" r="2.4" /></g>
    </symbol>

    <!-- B: Bold badge — filled gradient, white ligature -->
    <symbol id="B" viewBox="0 0 64 64">
      <clipPath id="bclip"><rect width="64" height="64" rx="18" /></clipPath>
      <g clip-path="url(#bclip)"><rect width="64" height="64" fill="url(#g2)" /><path d="M0 40 Q32 26 64 44 V64 H0z" fill="#fff" fill-opacity=".08" /></g>
      <path d="M14 46V18l10.5 15.5L35 18l11 28M24.5 33.5h17" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <!-- C: Hex chip — circuit pins -->
    <symbol id="C" viewBox="0 0 64 64">
      <g stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity=".8">
        <path d="M32 2v6M32 56v6M5 17l5 3M54 44l5 3M5 47l5-3M54 20l5-3" />
      </g>
      <path d="M32 8 53 20v24L32 56 11 44V20z" fill="url(#bg)" stroke="url(#g)" stroke-width="2.4" stroke-linejoin="round" />
      <path d="M19 41V23l7 10 7-10 7.5 18M26 33h11.3" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="26" cy="33" r="2.2" fill="#22d3ee" />
    </symbol>

    <!-- D: Code brackets -->
    <symbol id="D" viewBox="0 0 64 64">
      <rect x="1" y="1" width="62" height="62" rx="16" fill="#0a0c1b" stroke="rgba(255,255,255,.12)" />
      <path d="M13 22l-6 10 6 10M51 22l6 10-6 10" fill="none" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M18 42V22l7 10.5 7-10.5 7.5 20M25 32.5h11.5" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M43 44l4-24" stroke="#f472b6" stroke-width="3.4" stroke-linecap="round" />
    </symbol>

    <!-- E: AI sparkle -->
    <symbol id="E" viewBox="0 0 64 64">
      <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bg)" />
      <path d="M12 47V21l10.5 15.5L33 21l10.5 26M22.5 36.5h17.5" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M48 7c1 6 3 8 9 9-6 1-8 3-9 9-1-6-3-8-9-9 6-1 8-3 9-9z" fill="url(#g)" />
      <circle cx="40" cy="25" r="1.8" fill="#a78bfa" />
    </symbol>

    <!-- F: Monoline ring — editorial / minimal -->
    <symbol id="F" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="29" fill="none" stroke="url(#g)" stroke-width="2.2" />
      <path d="M16 43V21l8.5 12.5L33 21l9 22M24.5 33.5h14.2" fill="none" stroke="#94a3b8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="49" cy="43" r="2.6" fill="#22d3ee" />
    </symbol>

    <!-- G: Agent graph — abstract, no letters -->
    <symbol id="G" viewBox="0 0 64 64">
      <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bg)" />
      <g stroke="url(#g)" stroke-width="2.4" stroke-linecap="round" opacity=".9">
        <path d="M14 46 14 18 26 32 38 18 50 46M26 32 44 32M26 32 32 46M14 18 38 18" />
      </g>
      <g filter="url(#glow)">
        <circle cx="14" cy="18" r="4" fill="#a78bfa" /><circle cx="38" cy="18" r="4" fill="#818cf8" />
        <circle cx="26" cy="32" r="5" fill="#fff" />
        <circle cx="14" cy="46" r="3.2" fill="#22d3ee" /><circle cx="50" cy="46" r="3.2" fill="#f472b6" />
        <circle cx="44" cy="32" r="3" fill="#38bdf8" /><circle cx="32" cy="46" r="3" fill="#2dd4bf" />
      </g>
    </symbol>

    <!-- H: Split tile — two-tone M | A -->
    <symbol id="H" viewBox="0 0 64 64">
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="16" fill="#1e1b4b" stroke="url(#g)" stroke-opacity=".6" stroke-width="1.5" />
      <path d="M16 0h16v64H16a16 16 0 0 1-16-16V16A16 16 0 0 1 16 0z" fill="url(#g2)" />
      <path d="M8 44V22l7.5 11L23 22v22" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M38 44l8-22 8 22M41 36.5h10" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>

<script>
const concepts = [
  { id: 'A', name: 'Neural Monogram', picked: true, desc: 'Your pick: the MA ligature drawn as a network with glowing nodes at every joint.' },
  { id: 'B', name: 'Bold Badge', desc: 'Solid violet→cyan tile, chunky white ligature. App-icon style — the most legible at tiny sizes.' },
  { id: 'C', name: 'Hex Chip', desc: 'A hexagon “chip” with circuit pins. Engineering / hardware feel; the cyan dot marks the M–A join.' },
  { id: 'D', name: 'Code Tag', desc: 'The monogram wrapped in code brackets with a pink slash — reads as &lt;MA/&gt;. Unmistakably a developer.' },
  { id: 'E', name: 'AI Spark', desc: 'Clean white ligature with a gradient AI sparkle — the universal “AI” symbol, signals your agent work.' },
  { id: 'F', name: 'Monoline Ring', desc: 'Thin outline ligature in a gradient ring. Minimal and editorial — calm, premium, timeless.' },
  { id: 'G', name: 'Agent Graph', desc: 'Pure multi-agent graph, coloured nodes, no lettering — the MA shape is hidden in the connections.' },
  { id: 'H', name: 'Split Tile', desc: 'Two-tone tile: M on the gradient half, A on the dark half. Bold, graphic, very recognisable.' },
]
const use = (id, s) => `<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`
document.getElementById('grid').innerHTML = concepts.map(c => `
  <div class="card ${c.picked ? 'picked' : ''}">
    <div class="tag">Concept ${c.id}${c.picked ? ' · current pick' : ''}</div>
    <div class="name">${c.name}</div>
    <div class="desc">${c.desc}</div>
    <div class="hero">${use(c.id, 150)}</div>
    <div class="label">navbar · dark</div>
    <div class="row"><div class="lockup">${use(c.id, 36)} Mohammad<b>.</b></div></div>
    <div class="label">favicon · 32 / 16 px</div>
    <div class="row">${use(c.id, 32)} ${use(c.id, 16)}</div>
    <div class="label">on light background</div>
    <div class="row light"><div class="lockup">${use(c.id, 36)} Mohammad Akram</div></div>
  </div>`).join('')
</script>
</body>
</html>
