<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #05060f; }
  .wrap { position: relative; width: 1200px; height: 630px; padding: 80px 90px; font-family: Inter, sans-serif; color: #cbd5e1; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .55; }
  .b1 { width: 560px; height: 560px; background: #7c3aed; top: -220px; left: -160px; }
  .b2 { width: 520px; height: 520px; background: #06b6d4; bottom: -260px; right: -120px; opacity: .45; }
  .b3 { width: 340px; height: 340px; background: #db2777; top: 120px; right: 260px; opacity: .22; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 40% 40%, #000 30%, transparent 100%); }
  .content { position: relative; display: flex; flex-direction: column; height: 100%; }
  .top { display: flex; align-items: center; gap: 22px; }
  .top img { width: 112px; height: 112px; filter: drop-shadow(0 14px 40px rgba(124,58,237,.55)); }
  .badge { font-family: 'JetBrains Mono'; font-size: 20px; color: #6ee7b7; border: 1px solid rgba(110,231,183,.3); background: rgba(16,185,129,.08); padding: 8px 18px; border-radius: 999px; display: flex; align-items: center; gap: 10px; }
  .badge i { width: 10px; height: 10px; border-radius: 50%; background: #34d399; display: inline-block; }
  h1 { font-family: 'Space Grotesk'; font-weight: 700; font-size: 92px; line-height: 1; color: #fff; letter-spacing: -2px; margin-top: 44px; }
  h1 span { background: linear-gradient(90deg, #a78bfa, #22d3ee, #f472b6); -webkit-background-clip: text; color: transparent; }
  .role { font-family: 'JetBrains Mono'; font-size: 30px; color: #e2e8f0; margin-top: 22px; }
  .role b { color: #a78bfa; font-weight: 500; }
  .chips { display: flex; gap: 12px; margin-top: auto; }
  .chip { font-family: 'JetBrains Mono'; font-size: 20px; color: #cbd5e1; padding: 9px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); }
  .url { margin-left: auto; align-self: flex-start; margin-top: 8px; font-family: 'JetBrains Mono'; font-size: 22px; color: #67e8f9; }
</style>
</head>
<body>
<div class="wrap">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="top">
      <img src="/logo.svg" alt="" />
      <div class="badge"><i></i>10+ years · 3 live AI apps</div>
      <div class="url">mohammad-akram.onrender.com</div>
    </div>
    <h1>Mohammad <span>Akram</span></h1>
    <div class="role"><b>&gt;</b> Senior Full Stack Engineer · AI Agents</div>
    <div class="chips">
      <div class="chip">Angular</div><div class="chip">React</div><div class="chip">Next.js</div><div class="chip">Node.js</div><div class="chip">Claude API</div><div class="chip">RAG</div>
    </div>
  </div>
</div>
</body>
</html>
